<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zak &amp; Barbell Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout v2: one full screen for viewing from a distance. Left: phase label, huge exercise name, huge clock, draining bar. Right: quiet 'Hierna' column with the next three steps. Controls at the bottom. Dark-only so it reads in a gym. Red = boksen, orange = overige oefeningen, blue = rust. */
:root {
  --bg: #12151b;
  --panel: #1b2029;
  --fg: #eef1f5;
  --muted: #8a93a3;
  --work: #ff9d2e;
  --box: #ff4f4f;
  --rest: #46b6e8;
  --track: #262c37;
  --z1: #8a93a3;
  --z2: #46b6e8;
  --z3: #5fd08a;
  --z4: #ff9d2e;
  --z5: #ff4f4f;
  --zone: var(--z1);
  --phase: var(--work);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
.app {
  height: 100%; box-sizing: border-box;
  padding-inline: clamp(16px, 4vw, 56px); padding-block: clamp(14px, 3vh, 36px);
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 26vw, 380px);
  grid-template-rows: auto 1fr auto auto; column-gap: clamp(20px, 3vw, 48px); row-gap: clamp(10px, 2vh, 24px);
  grid-template-areas: "top top" "main side" "bar side" "ctrl ctrl";
}
.top { grid-area: top; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.block { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: clamp(15px, 2.2vw, 24px); color: var(--muted); }
.count { font-family: var(--mono); font-size: clamp(13px, 1.6vw, 18px); color: var(--muted); font-variant-numeric: tabular-nums; }
.main { grid-area: main; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 1.5vh, 18px); min-width: 0; }
.tag {
  align-self: flex-start; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .14em;
  font-size: clamp(16px, 2.4vw, 28px); color: var(--bg); background: var(--phase); padding: .15em .6em; border-radius: 4px;
}
.name {
  font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .92;
  font-size: clamp(44px, 10vw, 150px); margin: 0; text-wrap: balance; overflow-wrap: anywhere;
}
.detail { font-size: clamp(17px, 2.6vw, 32px); color: var(--muted); max-width: 40ch; line-height: 1.3; margin: 0; }
.clock {
  font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: .85;
  font-size: clamp(90px, 24vw, 340px); color: var(--phase); transition: color .3s;
}
.app.ending .clock { animation: pulse 1s steps(2) infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.bar { height: clamp(22px, 4.5vh, 48px); background: var(--track); border-radius: 6px; overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--phase); transform-origin: left; }
.overall { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.overall > div { height: 100%; width: 0; background: var(--muted); }
.barwrap { grid-area: bar; min-width: 0; }
.side { grid-area: side; align-self: center; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); min-width: 0; }
.hr {
  display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; row-gap: 4px;
  padding: .6em .8em; border-radius: 8px; background: color-mix(in srgb, var(--zone) 10%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--zone) 35%, var(--panel)); transition: background .6s, border-color .6s;
}
.hr .heart { width: clamp(28px, 3.4vw, 46px); height: auto; fill: var(--zone); transition: fill .6s; }
.hr.live .heart { animation: beat var(--beat, 1s) ease-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.18); } 25% { transform: scale(1); } }
.hr .bpm { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: .9; font-size: clamp(48px, 6.5vw, 104px); color: var(--fg); }
.hr .bpm small { font-size: .32em; font-weight: 600; color: var(--muted); letter-spacing: .06em; margin-left: .2em; }
.hr .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-family: var(--mono); font-size: clamp(12px, 1.2vw, 15px); color: var(--muted); font-variant-numeric: tabular-nums; }
.hr .meta .z { color: var(--zone); font-weight: 500; }
.hr canvas { grid-column: 1 / -1; width: 100%; height: clamp(44px, 7vh, 80px); display: block; }
.hr .connect { grid-column: 1 / -1; }
.hr .msg { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.35; margin: 0; }
.hr.live .connect { display: none; }
.maxhr { display: flex; align-items: center; gap: 6px; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-size: clamp(15px, 1.6vw, 19px); }
.maxhr input { width: 4.2em; font: inherit; font-family: var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--track); border-radius: 6px; padding: .35em .4em; }
@media (prefers-reduced-motion: reduce) { .hr.live .heart { animation: none; } }
.side h2 { margin: 0; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: clamp(14px, 1.6vw, 20px); color: var(--muted); }
.up { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 14px); }
.up li {
  --c: var(--work);
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 10px;
  padding: .55em .8em .6em; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 9%, var(--panel));
  border-left: 4px solid color-mix(in srgb, var(--c) 60%, var(--panel));
}
.up li.box { --c: var(--box); }
.up li.rest { --c: var(--rest); }
.up .n { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(17px, 2vw, 26px); line-height: 1.05; color: color-mix(in srgb, var(--fg) 78%, var(--bg)); min-width: 0; overflow-wrap: anywhere; }
.up .d { font-family: var(--mono); font-size: clamp(13px, 1.4vw, 17px); color: color-mix(in srgb, var(--c) 65%, var(--muted)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up li:nth-child(2) { opacity: .8; }
.up li:nth-child(3) { opacity: .62; }
.up .empty { color: var(--muted); font-size: clamp(15px, 1.6vw, 20px); background: none; border: 0; padding: 0; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; grid-template-areas: "top" "main" "bar" "side" "ctrl"; }
  .side { align-self: stretch; }
  .up { flex-direction: row; overflow-x: auto; }
  .up li { flex: 1 0 9.5em; }
}
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
  font-size: clamp(17px, 2vw, 22px); color: var(--fg); background: var(--panel);
  border: 1px solid var(--track); border-radius: 6px; padding: .55em 1.1em; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 3px solid var(--phase); outline-offset: 2px; }
.controls-wrap { grid-area: ctrl; display: flex; flex-direction: column; gap: 10px; }
.primary { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }
.primary button {
  display: flex; align-items: center; justify-content: center; gap: .5em;
  font-size: clamp(18px, 2.8vw, 34px); padding: .6em .5em; min-height: clamp(64px, 10vh, 110px); font-weight: 800;
}
.primary .ico { font-size: .8em; letter-spacing: -.15em; }
#play { background: var(--phase); color: var(--bg); border-color: transparent; }
.app.paused .clock { opacity: .4; }
.app.paused .tag { background: var(--muted); }
@media (max-width: 640px) { .primary .lbl { display: none; } #play .lbl { display: inline; } .primary .ico { font-size: 1.1em; } }
.spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); align-self: center; }
@media (max-width: 520px) { .hint { display: none; } .spacer { display: none; } }
@media (prefers-reduced-motion: reduce) { .app.ending .clock { animation: none; } }
</style>
</head>
<body>


<div class="app" id="app">
  <div class="top">
    <div class="block" id="block">Warming-up</div>
    <div class="count" id="count">1 / 1 · totaal 0:00</div>
  </div>

  <div class="main">
    <div class="tag" id="tag">Werk</div>
    <h1 class="name" id="name">Shadowboxen</h1>
    <p class="detail" id="detail"></p>
    <div class="clock" id="clock">3:00</div>
  </div>

  <div class="barwrap">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="overall"><div id="overall"></div></div>
  </div>

  <aside class="side" aria-label="Hartslag en volgende oefeningen">
    <div class="hr" id="hr">
      <svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.6 10.3 20C4.2 14.5 0 10.7 0 6.1 0 2.6 2.7 0 6.1 0c1.9 0 3.8.9 5.9 3 2.1-2.1 4-3 5.9-3C21.3 0 24 2.6 24 6.1c0 4.6-4.2 8.4-10.3 13.9z"/></svg>
      <div class="bpm" id="bpm">--<small>BPM</small></div>
      <div class="meta"><span class="z" id="zone">Niet verbonden</span><span id="hrstats"></span></div>
      <canvas id="spark" aria-hidden="true"></canvas>
      <button class="connect" id="connect" type="button">Verbind hartslag</button>
      <p class="msg" id="hrmsg" hidden></p>
    </div>
    <h2>Hierna</h2>
    <ol class="up" id="up"></ol>
  </aside>

  <div class="controls-wrap">
    <div class="primary">
      <button id="prev" type="button" aria-label="Vorige oefening"><span class="ico">&#9664;&#9664;</span><span class="lbl">Vorige oefening</span></button>
      <button id="play" type="button"><span class="ico" id="playIco">&#9654;</span><span class="lbl" id="playLbl">Start</span></button>
      <button id="skip" type="button" aria-label="Volgende oefening"><span class="lbl">Volgende oefening</span><span class="ico">&#9654;&#9654;</span></button>
    </div>
    <div class="controls">
      <button id="add" type="button">+15 sec</button>
      <label class="maxhr" for="maxhr">Max hartslag <input id="maxhr" type="number" min="120" max="230" value="178"></label>
      <span class="spacer"></span>
      <span class="hint">Spatie = start/pauze · pijltjes = vorige/volgende</span>
      <button id="sound" type="button">Geluid aan</button>
      <button id="full" type="button">Volledig scherm</button>
    </div>
  </div>
</div>

<script>
// ---- Workout opbouwen ----
const S = [];
const W = (block, name, sec, detail = "") => S.push({ block, name, sec, detail, rest: false });
const R = (block, sec, name = "Rust") => S.push({ block, name, sec, detail: "Ademen, drinken, gewicht klaarzetten", rest: true });

// Volgorde zo gekozen dat je maar twee keer van materiaal wisselt:
// shadowboxen (zonder handschoenen) > barbell > handschoenen aan voor alle zakwerk > handschoenen uit voor de finisher.
W("Warming-up", "Shadowboxen", 180, "Rustig opbouwen, losse schouders, voeten in beweging");
W("Warming-up", "Shadowboxen met voetenwerk", 60, "In en uit stappen, hoeken maken, jab-cross erbij");
for (let r = 1; r <= 2; r++) {
  const b = `Warming-up · ronde ${r}/2`;
  W(b, "Squats lege barbell", 45, "10 herhalingen, diep en gecontroleerd");
  W(b, "Roeien lege barbell", 45, "10 herhalingen, schouderbladen samen");
  W(b, "Heupbruggen", 40, "10 herhalingen, 1 tel vasthouden boven");
  W(b, "Armcirkels", 30, "10 per kant, voor- en achterwaarts");
}

for (let s = 1; s <= 4; s++) {
  W(`Kracht · squat set ${s}/4`, "Back of front squat", 45, "6 herhalingen, 1 à 2 in de tank");
  if (s < 4) R(`Kracht · squat set ${s}/4`, 120);
}
R("Kracht", 60, "Wisselen");
for (let r = 1; r <= 3; r++) {
  const b = `Kracht · superset ${r}/3`;
  W(b, "Romanian deadlift", 40, "8 herhalingen, rug neutraal, heupen naar achter");
  W(b, "Overhead press", 40, "8 herhalingen, billen en buik aan");
  R(b, 90);
}
for (let s = 1; s <= 3; s++) {
  W(`Kracht · roeien set ${s}/3`, "Barbell roeien", 45, "10 herhalingen, stang naar de navel");
  if (s < 3) R(`Kracht · roeien set ${s}/3`, 75);
}
R("Bokszak", 90, "Handschoenen aan");

const bag = [
  ["Jab-cross-hoek", "Vlotte voetjes, terug in dekking na elke combinatie"],
  ["Lowkicks + jab-cross", "Links en rechts afwisselen, heup erin draaien"],
  ["Knieën in de clinch", "Zak vastpakken, knie hoog, rechtop blijven"],
  ["Combinaties + trap", "Vrije combinaties, altijd eindigen met een trap"],
  ["Interval 20/10", "20 sec alles eruit, 10 sec licht tikken"],
  ["Vrije ronde", "Technisch en ontspannen, ademhaling laag"]
];
bag.forEach(([n, d], i) => {
  W(`Bokszak · ronde ${i + 1}/6`, n, 120, d);
  R(`Bokszak · ronde ${i + 1}/6`, i < 5 ? 60 : 30);
});
for (let r = 1; r <= 3; r++) {
  W(`Bokszak · burnout ${r}/3`, "Rechte stoten op de zak", 30, "Snel en hard, adem uit bij elke stoot");
  if (r < 3) R(`Bokszak · burnout ${r}/3`, 15);
}
R("Finisher", 60, "Handschoenen uit, dumbbells pakken");

for (let r = 1; r <= 3; r++) {
  const b = `Finisher · ronde ${r}/3`;
  W(b, "Dumbbell thrusters", 40, "10 herhalingen, diep zitten, krachtig drukken");
  W(b, "Renegade rows", 40, "10 herhalingen, heupen stil");
  W(b, "Plank", 30, "Strak lichaam, niet doorhangen");
  if (r < 3) R(b, 60);
}
W("Cooling-down", "Rekken", 300, "Heupbuigers, hamstrings, kuiten, schouders. Rustig ademen.");

// Soort per stap: boksen (rood), overige oefening (oranje), rust (blauw)
S.forEach(s => {
  s.type = s.rest ? "rest" : (/^Bokszak/.test(s.block) || /zak|boks|box/i.test(s.name)) ? "box" : "work";
});

// Materiaalpauze: wisselt een oefening direct (zonder rust ertussen) tussen boksen en overige oefeningen,
// dan komt er automatisch 10 seconden pauze tussen om te wisselen.
for (let k = S.length - 1; k > 0; k--) {
  const a = S[k - 1], b = S[k];
  if (a.type !== "rest" && b.type !== "rest" && a.type !== b.type) {
    S.splice(k, 0, {
      block: b.block, name: "Materiaalpauze", sec: 10, rest: true, type: "rest",
      detail: b.type === "box" ? "Handschoenen aan, naar de zak" : `Klaarmaken voor: ${b.name.toLowerCase()}`
    });
  }
}
const COLOR = { box: "var(--box)", work: "var(--work)", rest: "var(--rest)" };
const TAG = { box: "Boksen", work: "Werk", rest: "Rust" };

// ---- Status ----
const $ = id => document.getElementById(id);
let i = 0, remaining = S[0].sec * 1000, total = S[0].sec * 1000;
let running = false, last = 0, done = false, soundOn = true, ctx = null, lastBeep = -1, wake = null;
const totalSec = S.reduce((a, s) => a + s.sec, 0);
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };

function load(k) {
  i = Math.max(0, Math.min(S.length - 1, k));
  total = remaining = S[i].sec * 1000; lastBeep = -1; done = false;
  render();
}
function render() {
  const s = S[i];
  document.documentElement.style.setProperty("--phase", COLOR[s.type]);
  $("block").textContent = s.block;
  $("tag").textContent = done ? "Klaar" : TAG[s.type];
  $("name").textContent = done ? "Training klaar" : s.name;
  $("detail").textContent = done ? ("Goed gedaan. Drinken en rustig afkoelen." + (typeof hrCount !== "undefined" && hrCount ? ` Hartslag: gemiddeld ${Math.round(hrSum / hrCount)}, max ${hrMax}.` : "")) : s.detail;
  $("clock").textContent = fmt(remaining);
  $("fill").style.transform = `scaleX(${total ? remaining / total : 0})`;
  const upcoming = done ? [] : S.slice(i + 1, i + 4);
  const sig = done ? "done" : String(i);
  if ($("up").dataset.sig !== sig) {
    $("up").dataset.sig = sig;
    $("up").innerHTML = upcoming.length
      ? upcoming.map(n => `<li class="${n.type}"><span class="n">${n.name}</span><span class="d">(${fmt(n.sec * 1000)})</span></li>`).join("")
      : `<li class="empty">${done ? "Training voltooid" : "Dit is de laatste oefening"}</li>`;
  }
  const elapsed = S.slice(0, i).reduce((a, x) => a + x.sec, 0) + (s.sec - remaining / 1000);
  $("overall").style.width = `${(done ? 1 : elapsed / totalSec) * 100}%`;
  $("count").textContent = `${i + 1} / ${S.length} · nog ${fmt((totalSec - elapsed) * 1000)}`;
  const started = !(i === 0 && remaining === total);
  const paused = !running && !done && started;
  $("playLbl").textContent = done ? "Opnieuw" : running ? "Pauze" : paused ? "Verder" : "Start";
  $("playIco").innerHTML = running ? "&#10074;&#10074;" : done ? "&#8635;" : "&#9654;";
  if (paused) $("tag").textContent = "Gepauzeerd";
  $("app").classList.toggle("paused", paused);
  $("prev").disabled = i === 0;
  $("skip").disabled = done;
  $("app").classList.toggle("ending", running && remaining <= 3000 && remaining > 0);
}

// ---- Geluid ----
function beep(freq, dur = 0.15) {
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "square";
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}

// ---- Loop ----
function tick(t) {
  if (!running) return;
  remaining -= t - last; last = t;
  const sec = Math.ceil(remaining / 1000);
  if (sec <= 3 && sec >= 1 && sec !== lastBeep) { lastBeep = sec; beep(660); }
  if (remaining <= 0) {
    if (i < S.length - 1) { load(i + 1); beep(S[i].rest ? 520 : 990, 0.4); }
    else { remaining = 0; done = true; running = false; beep(990, 0.6); releaseWake(); render(); return; }
  }
  render();
  requestAnimationFrame(tick);
}
async function requestWake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }
function releaseWake() { try { wake?.release(); } catch (e) {} wake = null; }
function toggle() {
  if (done) { load(0); }
  running = !running;
  if (running) {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
    requestWake(); last = performance.now(); requestAnimationFrame(tick);
  } else releaseWake();
  render();
}
$("play").onclick = toggle;
$("skip").onclick = () => {
  if (i < S.length - 1) { load(i + 1); last = performance.now(); }
  else { remaining = 0; done = true; running = false; releaseWake(); render(); }
};
$("prev").onclick = () => { if (i > 0) { load(i - 1); last = performance.now(); } };
$("add").onclick = () => { remaining += 15000; total = Math.max(total, remaining); render(); };
$("sound").onclick = () => { soundOn = !soundOn; $("sound").textContent = soundOn ? "Geluid aan" : "Geluid uit"; };
$("full").onclick = async () => {
  try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch (e) {}
};
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") $("skip").click();
  else if (e.key === "ArrowLeft") $("prev").click();
});
document.addEventListener("visibilitychange", () => { if (running && document.visibilityState === "visible") requestWake(); });
// ---- Hartslag (Fitbit Air of andere Bluetooth-hartslagmeter) ----
const ZONES = [
  { min: 0,   n: 1, label: "Zone 1 · herstel", c: "var(--z1)" },
  { min: .6,  n: 2, label: "Zone 2 · licht",   c: "var(--z2)" },
  { min: .7,  n: 3, label: "Zone 3 · matig",   c: "var(--z3)" },
  { min: .8,  n: 4, label: "Zone 4 · zwaar",   c: "var(--z4)" },
  { min: .9,  n: 5, label: "Zone 5 · maximaal", c: "var(--z5)" }
];
let maxHR = 178, hrDevice = null, hrHistory = [], hrSum = 0, hrCount = 0, hrMax = 0, lastHrAt = 0;
try { const m = parseInt(localStorage.getItem("maxhr"), 10); if (m) maxHR = m; } catch (e) {}
$("maxhr").value = maxHR;
$("maxhr").addEventListener("change", e => {
  const v = parseInt(e.target.value, 10);
  if (v >= 120 && v <= 230) { maxHR = v; try { localStorage.setItem("maxhr", v); } catch (e) {} drawSpark(); }
});
const zoneOf = bpm => { let z = ZONES[0]; for (const x of ZONES) if (bpm >= x.min * maxHR) z = x; return z; };
function hrMsg(t) { $("hrmsg").hidden = !t; $("hrmsg").textContent = t || ""; }

function onHeartRate(ev) {
  const v = ev.target.value, flags = v.getUint8(0);
  const bpm = flags & 1 ? v.getUint16(1, true) : v.getUint8(1);
  if (!bpm) return;
  const now = Date.now(); lastHrAt = now;
  hrHistory.push({ t: now, bpm }); hrHistory = hrHistory.filter(p => now - p.t <= 5 * 60 * 1000);
  if (running) { hrSum += bpm; hrCount++; hrMax = Math.max(hrMax, bpm); }
  const z = zoneOf(bpm);
  document.documentElement.style.setProperty("--zone", z.c);
  document.documentElement.style.setProperty("--beat", (60 / bpm).toFixed(2) + "s");
  $("bpm").innerHTML = `${bpm}<small>BPM</small>`;
  $("zone").textContent = `${z.label} · ${Math.round(bpm / maxHR * 100)}%`;
  $("hrstats").textContent = hrCount ? `gem ${Math.round(hrSum / hrCount)} · max ${hrMax}` : "";
  $("hr").classList.add("live"); hrMsg("");
  drawSpark();
}

async function connectHR() {
  if (!navigator.bluetooth) {
    hrMsg("Bluetooth werkt hier niet. Open de timer in Chrome of Edge (niet op iPhone/iPad) via de GitHub-versie.");
    return;
  }
  try {
    hrMsg("Kies je Fitbit Air in de lijst. Staat hij er niet tussen? Zet in Google Health 'Share heart rate' aan.");
    hrDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: ["heart_rate"] }] });
    hrDevice.addEventListener("gattserverdisconnected", reconnectHR);
    await attachHR();
  } catch (e) {
    hrMsg(e && e.name === "NotFoundError" ? "Geen apparaat gekozen." : "Verbinden lukte niet: " + (e && e.message || e));
  }
}
async function attachHR() {
  $("zone").textContent = "Verbinden…";
  const server = await hrDevice.gatt.connect();
  const svc = await server.getPrimaryService("heart_rate");
  const ch = await svc.getCharacteristic("heart_rate_measurement");
  ch.addEventListener("characteristicvaluechanged", onHeartRate);
  await ch.startNotifications();
  $("zone").textContent = `Verbonden met ${hrDevice.name || "hartslagmeter"}`;
  hrMsg("");
}
async function reconnectHR() {
  $("hr").classList.remove("live");
  $("zone").textContent = "Verbinding weg, opnieuw verbinden…";
  for (let n = 0; n < 6 && hrDevice && !hrDevice.gatt.connected; n++) {
    await new Promise(r => setTimeout(r, 1500 * (n + 1)));
    try { await attachHR(); return; } catch (e) {}
  }
  if (!hrDevice.gatt.connected) {
    $("zone").textContent = "Niet verbonden";
    $("bpm").innerHTML = "--<small>BPM</small>";
    hrMsg("Verbinding verloren. Tik op 'Verbind hartslag' en controleer of delen aan staat op je Fitbit Air.");
  }
}
// Geen nieuwe meting meer binnen 10 sec: laat zien dat het getal oud is
setInterval(() => {
  if ($("hr").classList.contains("live") && Date.now() - lastHrAt > 10000) {
    $("hr").classList.remove("live"); $("zone").textContent = "Wacht op signaal…";
  }
}, 2000);
$("connect").onclick = connectHR;

function drawSpark() {
  const c = $("spark"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const lo = Math.round(maxHR * .5), hi = maxHR;
  const y = b => h - 2 - (Math.min(hi, Math.max(lo, b)) - lo) / (hi - lo) * (h - 4);
  // zonegrenzen als dunne lijnen
  g.lineWidth = 1;
  [.6, .7, .8, .9].forEach((f, k) => {
    g.strokeStyle = css.getPropertyValue("--z" + (k + 2)).trim(); g.globalAlpha = .22;
    g.beginPath(); g.moveTo(0, y(f * maxHR) + .5); g.lineTo(w, y(f * maxHR) + .5); g.stroke();
  });
  g.globalAlpha = 1;
  if (hrHistory.length < 2) return;
  const now = Date.now(), span = 5 * 60 * 1000, x = t => w - (now - t) / span * w;
  g.beginPath(); hrHistory.forEach((p, k) => k ? g.lineTo(x(p.t), y(p.bpm)) : g.moveTo(x(p.t), y(p.bpm)));
  g.strokeStyle = css.getPropertyValue("--fg").trim(); g.globalAlpha = .7; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
  g.globalAlpha = 1;
  const lastP = hrHistory[hrHistory.length - 1];
  g.fillStyle = css.getPropertyValue("--z" + zoneOf(lastP.bpm).n).trim();
  g.beginPath(); g.arc(x(lastP.t), y(lastP.bpm), 4, 0, Math.PI * 2); g.fill();
}
window.addEventListener("resize", drawSpark);
drawSpark();

render();
</script>

</body>
</html>
